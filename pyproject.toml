[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken"
version = "1.0.0"
description = "WPA/WPA2 audit toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "0xf0xy" }
]
dependencies = []

[project.scripts]
kraken = "kraken.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["kraken*"]